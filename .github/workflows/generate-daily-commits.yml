name: Generate Daily Commits

on:
  schedule:
    # Run daily at 9:00 AM UTC
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  generate-commits:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Setup Git
      run: |
        git config --global user.name "Daily Commit Bot"
        git config --global user.email "bot@khonology2.github.io"
        
    - name: Generate Daily Report
      run: |
        # Get current date with proper decimal formatting
        DAY=$(date +%-d)
        MONTH=$(date +%m)
        YEAR=$(date +%Y)
        
        # Calculate week of month (1-based)
        WEEK_OF_MONTH=$(((DAY - 1) / 7 + 1))
        
        # Format date for commit message
        DATE_STR="$YEAR-$MONTH-$DAY"
        
        echo "Generating daily report for $DATE_STR (Week $WEEK_OF_MONTH)"
        
        # Create daily report file
        echo "# Daily Report - $DATE_STR" > daily_report.md
        echo "Generated on: $(date)" >> daily_report.md
        echo "Week of month: $WEEK_OF_MONTH" >> daily_report.md
        echo "" >> daily_report.md
        echo "## Summary" >> daily_report.md
        echo "- Automated daily report generated" >> daily_report.md
        
        # Add and commit changes
        git add daily_report.md
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "Daily Report: $DATE_STR (Week $WEEK_OF_MONTH)"
          git push
        fi
