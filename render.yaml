services:
  # Node.js Backend - Web Service
  - type: web
    name: flow-space-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: DB_CONNECTION_MODE
        value: external
      - key: DATABASE_URL
        value: ${DATABASE_URL}
      - key: JWT_SECRET
        value: ${JWT_SECRET}
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
    healthCheckPath: /health

  # Flutter Frontend - Flutter Buildpack
  - type: web
    name: flow-space-frontend
    env: static
    rootDir: frontend
    buildCommand: flutter build web --web-renderer html
    staticPublishPath: build/web
    envVars:
      - key: BUILDPACK_URL
        value: https://github.com/subosito/flutter-buildpack
      - key: FLUTTER_WEB_CANVASKIT_URL
        value: https://cdn.jsdelivr.net/gh/flutter/canvaskit@master
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
