services:
  # Node.js Backend - Web Service
  - type: web
    name: flow-space-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: DB_CONNECTION_MODE
        value: external
      - key: DATABASE_URL
        value: ${DATABASE_URL}
      - key: JWT_SECRET
        value: ${JWT_SECRET}
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
    healthCheckPath: /health

  # Flutter Frontend - Flutter Buildpack
  - type: web
    name: flow-space-frontend
    env: static
    rootDir: frontend
    buildCommand: curl -L https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.41.7-stable.tar.xz -o flutter.tar.xz && tar xf flutter.tar.xz && export PATH="$PATH:`pwd`/flutter/bin" && flutter config --enable-web && flutter build web --dart-define=API_BASE_URL=https://flow-space.onrender.com/api/v1 --dart-define=IS_PRODUCTION=true
    staticPublishPath: build/web
    envVars:
      - key: FLUTTER_WEB_CANVASKIT_URL
        value: https://cdn.jsdelivr.net/gh/flutter/canvaskit@master
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
