services:
  # Node.js Backend - Web Service
  - type: web
    name: flow-space-backend
    env: node
    plan: starter
    rootDir: backend/node-backend
    buildCommand: npm install
    startCommand: node src/app.js
    envVars:
      - key: DB_CONNECTION_MODE
        value: external
      - key: DATABASE_URL
        value: ${DATABASE_URL}
      - key: JWT_SECRET
        value: ${JWT_SECRET}
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
    healthCheckPath: /api/v1/health

  - type: cron
    name: flow-space-backend-keepalive
    env: node
    plan: starter
    schedule: '*/2 * * * *'
    buildCommand: 'true'
    startCommand: "node -e \"const https=require('https'); const url='https://flow-space.onrender.com/api/v1/health'; const req=https.get(url,{headers:{accept:'application/json','user-agent':'flow-space-keepalive'}},res=>{res.on('data',()=>{}); res.on('end',()=>process.exit(0));}); req.on('error',()=>process.exit(0)); req.setTimeout(8000,()=>{try{req.destroy();}catch(_){} process.exit(0);});\""
  
  - type: worker
    name: flow-space-backend-keepalive-worker
    env: node
    plan: starter
    rootDir: backend/node-backend
    buildCommand: npm install
    startCommand: "node -e \"const https=require('https'); const url='https://flow-space.onrender.com/api/v1/health'; const ping=()=>{try{const req=https.get(url,{headers:{accept:'application/json','user-agent':'flow-space-keepalive-worker'}},res=>{res.on('data',()=>{}); res.on('end',()=>{});}); req.on('error',()=>{}); req.setTimeout(8000,()=>{try{req.destroy();}catch(_){};});}catch(_){}}; ping(); setInterval(ping, 120000);\""

  # Flutter Frontend - Flutter Buildpack
  - type: web
    name: flow-space
    env: static
    rootDir: frontend
    buildCommand: curl -L https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.41.7-stable.tar.xz -o flutter.tar.xz && tar xf flutter.tar.xz && export PATH="$PATH:`pwd`/flutter/bin" && flutter config --enable-web && flutter clean && flutter pub get && flutter build web --release --base-href / --dart-define=API_BASE_URL=https://flow-space.onrender.com/api/v1 --dart-define=IS_PRODUCTION=true --dart-define=DEBUG_MODE=false
    staticPublishPath: build/web
    envVars:
      - key: FLUTTER_WEB_CANVASKIT_URL
        value: https://cdn.jsdelivr.net/gh/flutter/canvaskit@master
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
